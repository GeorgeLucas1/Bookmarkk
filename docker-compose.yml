services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bookmark
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_documents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
